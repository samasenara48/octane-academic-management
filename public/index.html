<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Octane | Academic Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fa;
            color: #1f2937;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: bold;
        }

        .logo-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: white;
            color: #111827;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .container {
            text-align: center;
            padding: 100px 20px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .status {
            display: inline-block;
            padding: 12px 25px;
            background: #dcfce7;
            color: #166534;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">
            <div class="logo-circle">O</div>
            OCTANE
        </div>

        <div>
            Academic Management System
        </div>
    </header>

    <div class="container">

        <h1>Welcome to Octane</h1>

        <p>
            Academic Management System
        </p>

        <div class="status">
            ● System Running
        </div>

    </div>

</body>
</html>
